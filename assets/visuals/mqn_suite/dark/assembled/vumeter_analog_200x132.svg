    <path id="vumeter_arc_safe" d="M 40.26 56.14 A 86.0 86.0 0 0 1 116.41 33.58" fill="none" stroke="#F8DCE9" stroke-width="1.35" stroke-opacity="0.88" stroke-linecap="round"/>
    <path id="vumeter_arc_overload" d="M 116.41 33.58 A 86.0 86.0 0 0 1 159.74 56.14" fill="none" stroke="#FF1E8E" stroke-width="2.2" stroke-linecap="round" opacity="1.0" filter="url(#mqn_vu_subtle_bloom)"/>
    <line id="vumeter_tick_-44" data-deg="-44" data-val="-20" x1="40.26" y1="56.14" x2="46.16" y2="62.25" stroke="#F8DCE9" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.92"/>
    <text id="vumeter_val_-44" x="32.97" y="48.58" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#F2C8DC" opacity="0.92">-20</text>
    <line id="vumeter_tick_-33" data-deg="-33" data-val="-10" x1="53.16" y1="45.87" x2="56.16" y2="50.49" stroke="#F8DCE9" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.68"/>
