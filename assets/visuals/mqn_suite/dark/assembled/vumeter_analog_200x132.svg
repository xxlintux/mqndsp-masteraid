    <line id="vumeter_tick_-22" data-deg="-22" data-val="-7" x1="67.78" y1="38.26" x2="69.84" y2="43.36" stroke="#F8DCE9" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.68"/>
    <text id="vumeter_val_-22" x="63.85" y="28.53" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#F2C8DC" opacity="0.68">-7</text>
    <line id="vumeter_tick_-11" data-deg="-11" data-val="-5" x1="83.59" y1="33.58" x2="84.64" y2="38.98" stroke="#F8DCE9" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.68"/>
    <text id="vumeter_val_-11" x="81.59" y="23.27" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#F2C8DC" opacity="0.68">-5</text>
    <line id="vumeter_tick_0" data-deg="0" data-val="-3" x1="100.00" y1="32.00" x2="100.00" y2="40.50" stroke="#F8DCE9" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.92"/>
    <text id="vumeter_val_0" x="100.00" y="21.50" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#F2C8DC" opacity="0.92">-3</text>
    <line id="vumeter_tick_11" data-deg="11" data-val="0" x1="116.41" y1="33.58" x2="114.79" y2="41.92" stroke="#F8DCE9" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.92"/>
    <text id="vumeter_val_11" x="118.41" y="23.27" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#F2C8DC" opacity="0.92">0</text>
    <line id="vumeter_tick_22" data-deg="22" data-val="+1" x1="132.22" y1="38.26" x2="130.16" y2="43.36" stroke="#FF1E8E" stroke-width="1.4" stroke-linecap="round" stroke-opacity="1.0"/>
    <text id="vumeter_val_22" x="136.15" y="28.53" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#FF2491" opacity="1.0">+1</text>
    <line id="vumeter_tick_33" data-deg="33" data-val="+2" x1="146.84" y1="45.87" x2="143.84" y2="50.49" stroke="#FF1E8E" stroke-width="1.4" stroke-linecap="round" stroke-opacity="1.0"/>
