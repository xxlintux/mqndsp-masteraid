    <line id="vumeter_tick_44" data-deg="44" data-val="+3" x1="159.74" y1="56.14" x2="153.84" y2="62.25" stroke="#FF1E8E" stroke-width="1.4" stroke-linecap="round" stroke-opacity="1.0"/>
    <text id="vumeter_val_44" x="167.03" y="48.58" font-family="'SF Mono', Consolas, Menlo, monospace" font-variant-numeric="tabular-nums" font-size="6.8" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#FF2491" opacity="1.0">+3</text>
    <text x="100.0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle" fill="#D484AC" opacity="0.80">VU</text>
    <text x="100.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="700" letter-spacing="1.8" text-anchor="middle" fill="#FF2491" opacity="1.0">GR L</text>
  </g>
  <g filter="url(#mqn_vu_needle_shadow)">
    <g id="vumeter_needle" transform="rotate(-11.0 100.0 118.0)">
      <rect x="98.6" y="28" width="2.8" height="90" rx="1.4" fill="url(#mqn_vu_needle_grad)"/>
    </g>
  </g>
  <circle cx="100.0" cy="119.0" r="8.0" fill="url(#mqn_vu_pivot_grad)" stroke="#080306" stroke-width="0.9"/>
  <rect x="7.5" y="7.5" width="185" height="117" rx="10" fill="none" stroke="#000000" stroke-width="3.2" stroke-opacity="0.72" pointer-events="none"/>
</g>
<g id="vumeter_front_glass_lens" pointer-events="none">
<rect x="7" y="7" width="186" height="118" rx="10.5" fill="url(#mqn_vu_front_glass_tint)"/>
<rect x="9.5" y="9.0" width="181" height="10.0" rx="5.0" fill="#FFFFFF" opacity="0.05"/>
<rect x="7" y="7" width="186" height="118" rx="10.5" fill="none" stroke="#FF007F" stroke-opacity="0.26" stroke-width="0.9"/>
</g>
</g>
</svg>
