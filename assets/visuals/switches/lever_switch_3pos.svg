<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="440" height="180" style="background:#0A0C10; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Cyan Glow Filter for Active State -->
    <filter id="glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for Paddle Lift -->
    <filter id="shadow-paddle" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Hex Nut (Brushed Nickel) -->
    <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E7688" />
      <stop offset="30%" stop-color="#464D5C" />
      <stop offset="70%" stop-color="#282D38" />
      <stop offset="100%" stop-color="#161920" />
    </linearGradient>

    <!-- Threaded Bushing Collar -->
    <linearGradient id="bushing-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242934" />
      <stop offset="35%" stop-color="#586276" />
      <stop offset="65%" stop-color="#727D94" />
      <stop offset="100%" stop-color="#2C3240" />
    </linearGradient>

    <!-- 3D Spherical Ball Joint Radial Gradient -->
    <radialGradient id="ball-joint-grad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#C0CBE0" />
      <stop offset="55%" stop-color="#6E788C" />
      <stop offset="85%" stop-color="#343A48" />
      <stop offset="100%" stop-color="#161822" />
    </radialGradient>

    <!-- Slender Paddle Face - UP (tilted +45° into overhead light) -->
    <linearGradient id="paddle-face-up" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#363C4A" />
      <stop offset="25%" stop-color="#6E7B94" />
      <stop offset="55%" stop-color="#9EABC4" />
      <stop offset="85%" stop-color="#667288" />
      <stop offset="100%" stop-color="#303542" />
    </linearGradient>

    <!-- Slender Paddle Face - DOWN (tilted -45° downward away from overhead light) -->
    <linearGradient id="paddle-face-down" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242834" />
      <stop offset="25%" stop-color="#4E576A" />
      <stop offset="55%" stop-color="#727E96" />
      <stop offset="85%" stop-color="#485162" />
      <stop offset="100%" stop-color="#1E222A" />
    </linearGradient>

    <!-- Plain Top View Paddle Cap (Middle Position - 12px x 3.6px) -->
    <linearGradient id="paddle-topview" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9AA6BE" />
      <stop offset="50%" stop-color="#6A7488" />
      <stop offset="100%" stop-color="#363C4A" />
    </linearGradient>

    <!-- Tilted End Facet Highlights (45° cut face) -->
    <linearGradient id="facet-up-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EDFC" />
      <stop offset="100%" stop-color="#8E9AB4" />
    </linearGradient>

    <linearGradient id="facet-down-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2F3C" />
      <stop offset="100%" stop-color="#101218" />
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="220" y="18" fill="#7C869C" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">PRO-AUDIO 90&deg; ROTATION SPAN (&plusmn;45&deg; THROW) &bull; FLAT PADDLE SWITCH</text>

  <!-- ========================================================================= -->
  <!-- STATE 1: POS 0 (UP / SHELF: +45° TILT) - Center x = 75, Pivot y = 80       -->
  <!-- ========================================================================= -->
  <g id="switch-state-up" transform="translate(75, 5)">
    <text x="0" y="0" fill="#00D2FF" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">POS 0: SHELF (+45&deg;)</text>

    <!-- TOP LABEL: Snug above paddle tip -->
    <g id="up-label-top" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">
      <text x="0" y="50.5" fill="#00E5FF" filter="url(#glow-cyan)" text-anchor="middle">SHELF</text>
    </g>

    <!-- HEX MOUNTING NUT & BUSHING (Pivot at y = 80) -->
    <g id="up-mounting-collar" transform="translate(0, 80)">
      <circle cx="0" cy="0" r="13" fill="#13151B" stroke="#252A36" stroke-width="1" />
      <polygon points="0,-10.5 9,-5.2 9,5.2 0,10.5 -9,5.2 -9,-5.2" fill="url(#hex-grad)" stroke="#0E1015" stroke-width="1" />
      <polygon points="0,-9.5 8,-4.7 8,4.7 0,9.5 -8,4.7 -8,-4.7" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6" />
      <circle cx="0" cy="0" r="6.2" fill="url(#bushing-grad)" stroke="#111318" stroke-width="0.8" />
      <!-- Circular socket hole -->
      <circle cx="0" cy="0" r="4.8" fill="#07080B" stroke="#1D212A" stroke-width="0.7" />
      <!-- Polished 3D Spherical Ball Joint nestled in socket -->
      <circle cx="0" cy="0" r="4.2" fill="url(#ball-joint-grad)" stroke="#151720" stroke-width="0.5" />
    </g>

    <!-- SLENDER TRAPEZOIDAL PADDLE (UP POSITION: +45° FORESHORTENED) -->
    <!-- Blade height: 14px (y=77 to y=63), Tip facet: 1.8px (y=63 to y=61.2) -->
    <g id="up-paddle" filter="url(#shadow-paddle)">
      <!-- Sleek neck emerging directly from ball joint (width 2.8px at y=77) -->
      <path d="M -1.4 79 L -1.4 77 L 1.4 77 L 1.4 79 Z" fill="#586276" stroke="#151720" stroke-width="0.5" />

      <!-- Slender Trapezoid Blade: 2.8px at base (y=77) to 9.2px at tip (y=63) -->
      <polygon points="-1.4,77 -4.6,63 4.6,63 1.4,77" fill="url(#paddle-face-up)" stroke="#161822" stroke-width="0.75" />

      <!-- 45° Angle Top Facet Cap: 1.8px height (y=61.2 to y=63), width 9.2px -->
      <polygon points="-4.6,63 -4.0,61.2 4.0,61.2 4.6,63" fill="url(#facet-up-grad)" stroke="#151720" stroke-width="0.6" />
      <!-- Sharp ambient top edge highlight -->
      <line x1="-3.8" y1="61.7" x2="3.8" y2="61.7" stroke="rgba(255,255,255,0.75)" stroke-width="0.7" />

      <!-- Subtle side chamfers -->
      <line x1="-4.6" y1="63" x2="-1.4" y2="77" stroke="rgba(255,255,255,0.22)" stroke-width="0.6" />
      <line x1="4.6" y1="63" x2="1.4" y2="77" stroke="rgba(0,0,0,0.5)" stroke-width="0.7" />
    </g>

    <!-- MIDDLE LABEL: TO THE SIDE (Right) -->
    <g id="up-label-mid" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="800" letter-spacing="0.5">
      <text x="16" y="83" fill="#586172">BELL</text>
    </g>

    <!-- BOTTOM LABEL: Snug below the hex nut -->
    <g id="up-label-bottom" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">
      <text x="0" y="116" fill="#586172" text-anchor="middle">OFF</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- STATE 2: POS 1 (CENTER / BELL: 0° NORMAL) - Center x = 220, Pivot y = 80   -->
  <!-- PLAIN TOP VIEW (Verified perfect - 12px x 3.6px: LARGEST TIP VIEW)        -->
  <!-- ========================================================================= -->
  <g id="switch-state-center" transform="translate(220, 5)">
    <text x="0" y="0" fill="#00D2FF" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">POS 1: BELL (0&deg; NORMAL)</text>

    <!-- TOP LABEL: Snug on top -->
    <g id="mid-label-top" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">
      <text x="0" y="50.5" fill="#586172" text-anchor="middle">SHELF</text>
    </g>

    <!-- HEX MOUNTING NUT & BUSHING (Pivot at y = 80) -->
    <g id="mid-mounting-collar" transform="translate(0, 80)">
      <circle cx="0" cy="0" r="13" fill="#13151B" stroke="#252A36" stroke-width="1" />
      <polygon points="0,-10.5 9,-5.2 9,5.2 0,10.5 -9,5.2 -9,-5.2" fill="url(#hex-grad)" stroke="#0E1015" stroke-width="1" />
      <polygon points="0,-9.5 8,-4.7 8,4.7 0,9.5 -8,4.7 -8,-4.7" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6" />
      <circle cx="0" cy="0" r="6.2" fill="url(#bushing-grad)" stroke="#111318" stroke-width="0.8" />
      <!-- Socket hole -->
      <circle cx="0" cy="0" r="4.8" fill="#07080B" stroke="#1D212A" stroke-width="0.7" />
      <!-- Polished 3D Ball Joint -->
      <circle cx="0" cy="0" r="4.2" fill="url(#ball-joint-grad)" stroke="#151720" stroke-width="0.5" />
    </g>

    <!-- PLAIN TOP VIEW OF PADDLE: 12px x 3.6px rectangle (largest view of the tip) -->
    <g id="mid-paddle-topview" filter="url(#shadow-paddle)">
      <rect x="-6" y="78.2" width="12" height="3.6" rx="1" fill="url(#paddle-topview)" stroke="#141720" stroke-width="0.85" />
      <line x1="-5.2" y1="78.7" x2="5.2" y2="78.7" stroke="rgba(255,255,255,0.65)" stroke-width="0.7" stroke-linecap="round" />
      <line x1="-5.2" y1="81.3" x2="5.2" y2="81.3" stroke="rgba(0,0,0,0.65)" stroke-width="0.7" stroke-linecap="round" />
    </g>

    <!-- MIDDLE LABEL: TO THE SIDE (Right) - ACTIVE CYAN -->
    <g id="mid-label-mid" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="800" letter-spacing="0.5">
      <text x="16" y="83" fill="#00E5FF" filter="url(#glow-cyan)">BELL</text>
    </g>

    <!-- BOTTOM LABEL: Snug below -->
    <g id="mid-label-bottom" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">
      <text x="0" y="116" fill="#586172" text-anchor="middle">OFF</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- STATE 3: POS 2 (DOWN / OFF: -45° TILT) - Center x = 365, Pivot y = 80      -->
  <!-- EXACT 1:1 REVERSED GEOMETRY OF UP (minus lighting)                        -->
  <!-- ========================================================================= -->
  <g id="switch-state-down" transform="translate(365, 5)">
    <text x="0" y="0" fill="#00D2FF" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">POS 2: OFF (-45&deg;)</text>

    <!-- TOP LABEL: Snug on top -->
    <g id="down-label-top" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">
      <text x="0" y="50.5" fill="#586172" text-anchor="middle">SHELF</text>
    </g>

    <!-- HEX MOUNTING NUT & BUSHING (Pivot at y = 80) -->
    <g id="down-mounting-collar" transform="translate(0, 80)">
      <circle cx="0" cy="0" r="13" fill="#13151B" stroke="#252A36" stroke-width="1" />
      <polygon points="0,-10.5 9,-5.2 9,5.2 0,10.5 -9,5.2 -9,-5.2" fill="url(#hex-grad)" stroke="#0E1015" stroke-width="1" />
      <polygon points="0,-9.5 8,-4.7 8,4.7 0,9.5 -8,4.7 -8,-4.7" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6" />
      <circle cx="0" cy="0" r="6.2" fill="url(#bushing-grad)" stroke="#111318" stroke-width="0.8" />
      <!-- Socket hole -->
      <circle cx="0" cy="0" r="4.8" fill="#07080B" stroke="#1D212A" stroke-width="0.7" />
      <!-- Polished 3D Ball Joint -->
      <circle cx="0" cy="0" r="4.2" fill="url(#ball-joint-grad)" stroke="#151720" stroke-width="0.5" />
    </g>

    <!-- SLENDER TRAPEZOIDAL PADDLE: DOWN POSITION (-45° 1:1 Mirrored replica of UP) -->
    <!-- Blade height: 14px (y=83 to y=97), Tip facet: 1.8px (y=97 to y=98.8) -->
    <g id="down-paddle" filter="url(#shadow-paddle)">
      <!-- Neck emerging directly from ball joint (mirrored 80 to 83, width 2.8px) -->
      <path d="M -1.4 81 L -1.4 83 L 1.4 83 L 1.4 81 Z" fill="#444C5C" stroke="#151720" stroke-width="0.5" />

      <!-- Slender Trapezoid Blade: 2.8px at base (y=83) to 9.2px at tip (y=97) -->
      <polygon points="-1.4,83 -4.6,97 4.6,97 1.4,83" fill="url(#paddle-face-down)" stroke="#161822" stroke-width="0.75" />

      <!-- 45° Angle Bottom Facet Cap: 1.8px height (y=97 to y=98.8), width 9.2px -->
      <polygon points="-4.6,97 -4.0,98.8 4.0,98.8 4.6,97" fill="url(#facet-down-grad)" stroke="#151720" stroke-width="0.6" />
      <!-- Ambient highlight on top neck transition at y=83 -->
      <line x1="-1.3" y1="83.5" x2="1.3" y2="83.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />

      <!-- Side chamfers -->
      <line x1="-1.4" y1="83" x2="-4.6" y2="97" stroke="rgba(255,255,255,0.18)" stroke-width="0.6" />
      <line x1="1.4" y1="83" x2="4.6" y2="97" stroke="rgba(0,0,0,0.55)" stroke-width="0.7" />
    </g>

    <!-- MIDDLE LABEL: TO THE SIDE (Right) -->
    <g id="down-label-mid" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="800" letter-spacing="0.5">
      <text x="16" y="83" fill="#586172">BELL</text>
    </g>

    <!-- BOTTOM LABEL: Snug below paddle tip - ACTIVE CYAN -->
    <g id="down-label-bottom" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">
      <text x="0" y="116" fill="#00E5FF" filter="url(#glow-cyan)" text-anchor="middle">OFF</text>
    </g>
  </g>

  <!-- Explanatory Caption -->
  <text x="220" y="160" fill="#4E5566" font-size="7.5" font-weight="600" letter-spacing="0.5" text-anchor="middle">AUTHENTIC 90&deg; ROTATION ARC &bull; FORESHORTENED 45&deg; ANGLED BLADES &bull; ZERO TRACK LINES</text>
</svg>
